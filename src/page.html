<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EcoRuta · Comparte el camino</title>
<style>
:root{--forest:#123c31;--green:#217754;--lime:#d6f18a;--bg:#f5f7f2;--line:#dfe5da;--muted:#69776e;--ink:#19372d}*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94bd3e;outline-offset:3px}a{color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:36px;line-height:1.18;letter-spacing:-1.2px}h2{font-size:23px;letter-spacing:-.5px}h3{font-size:18px}small{font-size:12px}.muted{color:var(--muted)}.tag{font-size:11px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase}.demo{background:#e9efdb;border-bottom:1px solid #dce5c8;padding:7px 20px;text-align:center;font-size:12px}.brand{display:flex;gap:10px;align-items:center;font-size:25px;font-weight:800;letter-spacing:-1px}.logo{display:grid;place-items:center;width:40px;height:40px;background:var(--lime);border-radius:13px;color:var(--forest)}svg{vertical-align:middle}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 33px)}aside{background:white;border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;gap:32px}nav{display:grid;gap:8px}nav button{border-radius:10px;text-align:left;padding:12px 14px;background:transparent;color:var(--muted)}nav button.active{color:var(--forest);background:#eaf1df;font-weight:700}nav button:hover{background:#f0f4eb}.side-note{margin-top:auto;padding:18px;background:var(--forest);color:white;border-radius:16px}.side-note p{font-size:12px;margin-top:8px;color:#d4e0d9}.side-note .tag{color:var(--lime)}main{padding:28px 42px 50px;max-width:1550px;width:100%;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;gap:18px}.profile{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#e2ebda;display:grid;place-items:center;font-weight:800}.link-btn{background:transparent;color:var(--green);font-size:12px;padding:4px}.hero{padding:32px 36px;background:var(--forest);color:white;border-radius:23px;display:grid;grid-template-columns:1.5fr 1fr;overflow:hidden;position:relative;gap:20px}.hero h1{max-width:500px;margin:12px 0}.hero p{max-width:460px;color:#c7d9cf}.hero .tag{color:var(--lime)}.route-art{position:relative;min-height:175px;display:grid;place-items:center}.route-art svg{width:100%;height:175px}.route-art .label{position:absolute;background:#fff;color:var(--forest);font-size:12px;border-radius:8px;padding:7px 10px;right:4px;bottom:15px}.stats{display:flex;gap:24px;flex-wrap:wrap;padding:22px 4px}.stat{display:flex;align-items:center;gap:10px}.stat strong{font-size:22px}.stat span{font-size:12px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px}.filters{display:grid;grid-template-columns:1fr 180px auto;gap:14px;align-items:end}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700}.field input,.field select{padding:11px 13px;width:100%;border:1px solid #d8e0d4;border-radius:9px;background:#fff;color:var(--ink);min-width:0}.btn{padding:12px 20px;background:var(--green);color:white;border-radius:9px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{background:#165f42}.btn.secondary{background:#edf3e4;color:var(--forest)}.btn.danger{background:#fff0e9;color:#9b3e1e}.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 16px;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.trip{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.trip-head{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #edf1e8;gap:10px;align-items:center}.badge{font-size:11px;border-radius:20px;padding:4px 9px;background:#edf5df;color:#3f6426;font-weight:650}.badge.pending{background:#fff3d4;color:#836214}.badge.cancelled,.badge.rejected{background:#fbe6df;color:#9b3e1e}.badge.completed,.badge.accepted{background:#e0eee6;color:#286347}.trip-body{padding:22px}.route{display:grid;grid-template-columns:16px 1fr;column-gap:10px;row-gap:17px;margin:17px 0}.dot{width:9px;height:9px;border:2px solid var(--green);border-radius:50%;margin:7px 0;position:relative}.dot:first-child:after{position:absolute;content:'';height:39px;width:1px;top:12px;left:2px;background:#d3decf}.dot.end{background:var(--green)}.route strong{display:block;font-size:16px}.route small{color:var(--muted)}.trip-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #edf1e8;padding-top:17px;margin-top:17px}.price{font-size:25px;font-weight:800;letter-spacing:-1px}.price small{font-weight:400;letter-spacing:0;color:var(--muted)}.meeting{font-size:12px;color:var(--muted);margin-top:15px}.empty{padding:42px;text-align:center;border:1px dashed #ccd8c5;border-radius:16px;grid-column:1/-1;background:#fff}.empty p{margin:10px auto 0;max-width:390px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}.form-note{padding:14px 16px;background:#f2f6ea;border-radius:10px;font-size:13px}.request-list{display:grid;gap:16px}.request{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.request small{display:block;margin:6px 0;color:var(--muted)}#notice{position:fixed;right:25px;bottom:25px;z-index:5;padding:14px 20px;background:var(--forest);color:white;border-radius:12px;box-shadow:0 8px 30px #0002;max-width:min(90vw,480px)}#notice:empty{display:none}#notice.error{background:#963e2e}.login-wrap{min-height:calc(100vh - 33px);display:grid;grid-template-columns:1.1fr 1fr}.login-story{background:var(--forest);padding:55px 12%;color:white;display:flex;flex-direction:column;justify-content:center}.login-story h1{font-size:54px;margin:40px 0 18px;max-width:480px}.login-story p{color:#c7d9cf;max-width:380px}.login-story .route-art{margin:30px 0;max-width:440px}.login-content{padding:50px 12%;display:flex;flex-direction:column;justify-content:center}.login-content h2{font-size:30px}.login-content>p{margin:10px 0 25px}.login-content form{display:grid;gap:18px}.demo-accounts{margin-top:28px;border:1px solid var(--line);border-radius:14px;padding:18px;background:white}.account-buttons{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}.account-buttons button{padding:7px 10px;border-radius:6px;background:#edf3e4;color:var(--forest);font-size:12px}.demo-accounts code{font-family:inherit;font-weight:700}.intro{margin-bottom:22px}.intro p{margin-top:8px}.mobile-brand{display:none}.text-error{color:#a13626;font-size:13px;min-height:20px}.loading{padding:10vh;text-align:center}.statusline{font-size:12px;margin-top:10px}.section-title p{font-size:13px;color:var(--muted)}
@media(min-width:1450px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1050px){.shell{grid-template-columns:190px 1fr}main{padding:25px}.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .route-art{display:none}.login-story{padding:40px 10%}.login-story h1{font-size:42px}.login-content{padding:40px 9%}}@media(max-width:700px){.shell{display:block}aside{padding:14px;gap:14px;border-right:0;border-bottom:1px solid var(--line)}aside .brand,aside .side-note{display:none}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;padding:9px;font-size:12px}main{padding:20px 16px}.topbar{margin-bottom:22px}.topbar>.tag{display:none}.mobile-brand{display:flex;font-size:21px}.profile small{font-size:10px}.hero{padding:26px}.hero h1{font-size:30px}.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}.stats{gap:16px}.stat strong{font-size:19px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.login-wrap{display:block}.login-story{padding:25px}.login-story h1{font-size:30px;margin:20px 0 10px}.login-story .route-art{display:none}.login-story>p{font-size:13px}.login-content{padding:30px 24px}.login-content h2{font-size:25px}.demo{font-size:10px}.hero p{font-size:13px}.section-title{align-items:start}.section-title h2{font-size:21px}}
</style></head><body><div class="demo">DEMOSTRACIÓN ACADÉMICA · Todos los viajes y perfiles son ficticios. No coordines traslados reales aquí.</div><div id="app"><p class="loading">Cargando EcoRuta…</p></div><div id="notice" role="status" aria-live="polite"></div>
<script>
const leaf='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 4C7 2 3 7 5 14c2 7 14 5 14-10Z" stroke="currentColor" stroke-width="1.8"/><path d="m5 20 9-11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const brand='<div class="brand"><span class="logo">'+leaf+'</span>EcoRuta<span style="color:#73924d">.</span></div>';
const art='<div class="route-art" aria-hidden="true"><svg viewBox="0 0 360 175"><path d="M20 140C120 150 35 20 160 38S240 150 335 40" fill="none" stroke="#456d58" stroke-width="45"/><path d="M20 140C120 150 35 20 160 38S240 150 335 40" fill="none" stroke="#c5e488" stroke-width="2" stroke-dasharray="6 7"/><circle cx="20" cy="140" r="10" fill="#d6f18a"/><circle cx="335" cy="40" r="10" fill="#d6f18a"/><rect x="158" y="42" width="51" height="28" rx="9" fill="#d6f18a" transform="rotate(30 180 55)"/><circle cx="167" cy="47" r="3" fill="#123c31"/><circle cx="198" cy="64" r="3" fill="#123c31"/></svg><span class="label">Un camino compartido</span></div>';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'America/Lima'}).format(new Date(d));
const money=v=>Number(v).toFixed(2);const labels={open:'Disponible',pending:'Pendiente',accepted:'Confirmada',rejected:'Rechazada',cancelled:'Cancelada',completed:'Finalizado'};
let state={user:null,view:'explore',trips:[],requests:[],origin:'',date:'',busy:false};
async function api(path,method='GET',data){let r=await fetch('/api/'+path,{method,headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok){if(r.status===401&&path!=='login'){state.user=null;render()}throw Error(j.error||'No se pudo completar la acción.')}return j;}
let noticeTimer;function notify(message,error=false){let el=document.querySelector('#notice');el.textContent=message;el.className=error?'error':'';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.textContent='',7000)}
function badge(status){return '<span class="badge '+esc(status)+'">'+esc(labels[status]||status)+'</span>'}
function loginView(){return '<div class="login-wrap"><section class="login-story">'+brand+'<h1>Tu próximo viaje,<br>mejor acompañado.</h1><p>Comparte la ruta hacia Tecsup. Acuerda el punto de encuentro y conoce el estado de tu cupo antes de salir.</p>'+art+'<small>Coordinación simple · Aporte visible · Cupos confirmados</small></section><section class="login-content"><div class="tag muted">BIENVENIDO A ECORUTA</div><h2 style="margin-top:12px">Vamos al mismo lugar.</h2><p class="muted">Ingresa para explorar viajes o compartir los cupos de tu carro.</p><form id="login"><div class="field"><label for="email">Correo de prueba</label><input id="email" name="email" type="email" required autocomplete="username" placeholder="pasajero@ecoruta.test"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" required autocomplete="current-password"></div><p id="login-error" class="text-error" role="alert"></p><button class="btn" type="submit">Entrar a EcoRuta →</button></form><div class="demo-accounts"><strong>Prueba ambos lados del viaje</strong><div class="account-buttons"><button type="button" data-account="pasajero">Pasajero</button><button type="button" data-account="conductor">Conductor</button><button type="button" data-account="pasajero2">Segundo pasajero</button></div><small>Selecciona un perfil para completar sus datos.<br>Contraseña de prueba: <code>EcoRuta2026!</code></small></div></section></div>'}
function render(){let u=state.user;if(!u){document.querySelector('#app').innerHTML=loginView();return}let isDriver=u.role==='driver';let items=[['explore','↗','Explorar viajes'],['mine','◷','Mis viajes'],['requests','☷',isDriver?'Solicitudes recibidas':'Mis solicitudes']];if(isDriver)items.push(['publish','＋','Publicar viaje']);document.querySelector('#app').innerHTML='<div class="shell"><aside>'+brand+'<nav aria-label="Navegación principal">'+items.map(([v,i,l])=>'<button data-nav="'+v+'" class="'+(state.view===v?'active':'')+'">'+i+' &nbsp; '+l+'</button>').join('')+'</nav><div class="side-note"><div class="tag">COMPARTE LA RUTA</div><h3 style="margin-top:8px">Menos coordinación.<br>Más tranquilidad.</h3><p>Un cupo se confirma cuando el conductor acepta la solicitud.</p></div></aside><main><div class="topbar"><span class="tag muted">MOVILIDAD COMPARTIDA · TECSUP</span><div class="mobile-brand">'+brand+'</div><div class="profile"><div class="avatar">'+esc(u.name[0])+'</div><div><strong>'+esc(u.name)+'</strong><br><small class="muted">'+(isDriver?'Conductor':'Pasajero')+' · <button class="link-btn" data-action="logout">Salir</button></small></div></div></div><div id="view">'+view()+'</div><p class="muted" style="margin-top:30px;font-size:11px">EcoRuta · Zona horaria: Lima (UTC−5) · Los aportes se acuerdan fuera de esta demostración. No se realizan cobros.</p></main></div>'}
function view(){if(state.view==='publish')return publishView();if(state.view==='requests')return requestsView();let explore=state.view==='explore';let intro=explore?'<section class="hero"><div><div class="tag">COMPARTE EL CAMINO</div><h1>Encuentra tu ruta.<br>Confirma tu lugar.</h1><p>Viajes con origen, horario y aporte claros. Busca uno que coincida contigo y solicita tu cupo.</p></div>'+art+'</section><div class="stats"><div class="stat"><strong>'+state.trips.length+'</strong><span>viajes en tu búsqueda</span></div><div class="stat"><strong>'+state.trips.reduce((a,t)=>a+t.available,0)+'</strong><span>cupos disponibles</span></div><div class="stat"><strong>S/</strong><span>aporte transparente</span></div></div><form id="search" class="panel filters"><div class="field"><label for="origin">¿Desde dónde sales?</label><input id="origin" name="origin" maxlength="60" placeholder="Ej. San Miguel" value="'+esc(state.origin)+'"></div><div class="field"><label for="date">Fecha de salida</label><input id="date" name="date" type="date" value="'+esc(state.date)+'"></div><button class="btn">Buscar viajes →</button></form>':'<div class="intro"><div class="tag muted">TUS RECORRIDOS</div><h1 style="margin-top:10px">Mis viajes</h1><p class="muted">'+(state.user.role==='driver'?'Administra tus publicaciones y revisa su estado.':'Consulta los viajes en los que solicitaste un cupo.')+'</p></div>';return intro+'<div class="section-title"><div><h2>'+(explore?'Viajes disponibles':'Tus publicaciones y recorridos')+'</h2><p>'+(explore?'Elige un horario que funcione para ti.':'Los cambios se conservan al volver a ingresar.')+'</p></div><button class="btn secondary" data-action="refresh">↻ Actualizar</button></div><div class="grid">'+(state.trips.length?state.trips.map(tripView).join(''):'<div class="empty"><h3>'+(explore?'No encontramos viajes con estos filtros':'Todavía no tienes viajes')+'</h3><p>'+(explore?'Prueba otro origen o fecha. También puedes borrar los filtros y volver a buscar.':'Publica un viaje o solicita un cupo desde Explorar viajes.')+'</p></div>')+'</div>'}
function tripView(t){let mine=t.driver_id===state.user.id;let active=t.status==='open'&&new Date(t.departure)>new Date();let actions='';if(mine&&state.view==='mine'){if(active)actions+='<button class="btn danger" data-action="cancel-trip" data-id="'+esc(t.id)+'">Cancelar viaje</button>';if(t.status==='open'&&!active)actions+='<button class="btn secondary" data-action="complete" data-id="'+esc(t.id)+'">Finalizar viaje</button>'}else if(state.user.role==='passenger'&&state.view==='explore'){actions='<button class="btn" data-action="ask" data-id="'+esc(t.id)+'" '+(t.available<1?'disabled':'')+'>'+(t.available<1?'Sin cupos':'Solicitar cupo →')+'</button>'}return '<article class="trip"><div class="trip-head"><span>◷ <strong>'+esc(fmt(t.departure))+'</strong></span>'+badge(t.status)+'</div><div class="trip-body"><small class="muted">Conduce '+esc(t.driver_name)+'</small><div class="route"><span class="dot"></span><div><strong>'+esc(t.origin)+'</strong><small>Origen</small></div><span class="dot end"></span><div><strong>'+esc(t.destination)+'</strong><small>Destino</small></div></div><div class="meeting">⌖ Encuentro: '+esc(t.meeting)+'</div><div class="trip-foot"><div class="price">S/ '+money(t.cost)+' <small>por persona</small><div class="muted" style="font-size:12px;font-weight:400;letter-spacing:0">'+t.available+' de '+t.capacity+' cupos libres</div></div>'+actions+'</div></div></article>'}
function publishView(){return '<div class="intro"><div class="tag muted">COMPARTE TUS CUPOS</div><h1 style="margin-top:10px">Publicar un viaje</h1><p class="muted">Define una salida clara para que otros puedan coordinar contigo.</p></div><form id="publish" class="panel form-grid" style="max-width:850px"><div class="field"><label for="from">Origen ficticio</label><input id="from" name="origin" required minlength="2" maxlength="60" placeholder="Ej. San Miguel"></div><div class="field"><label for="to">Destino</label><input id="to" name="destination" required minlength="2" maxlength="60" value="Campus Tecsup"></div><div class="field"><label for="departure">Fecha y hora de salida</label><input id="departure" name="departure" type="datetime-local" required></div><div class="field"><label for="capacity">Cupos que ofreces</label><select id="capacity" name="capacity">'+[1,2,3,4,5,6].map(n=>'<option>'+n+'</option>').join('')+'</select></div><div class="field wide"><label for="meeting">Punto de encuentro ficticio</label><input id="meeting" name="meeting" required minlength="3" maxlength="120" placeholder="Ej. Paradero Central ficticio"></div><div class="field"><label for="cost">Aporte por persona en soles</label><input id="cost" name="cost" type="number" min="0" max="100" step="0.01" required placeholder="5.00"></div><div class="form-note wide">Publica únicamente datos ficticios. El aporte se muestra para coordinar; EcoRuta no procesa pagos.</div><p id="publish-error" class="text-error wide" role="alert"></p><div class="wide"><button class="btn" type="submit">Publicar viaje →</button></div></form>'}
function requestsView(){let driver=state.user.role==='driver';return '<div class="intro"><div class="tag muted">CADA CUPO EN ORDEN</div><h1 style="margin-top:10px">'+(driver?'Solicitudes recibidas':'Mis solicitudes')+'</h1><p class="muted">'+(driver?'Acepta o rechaza solicitudes. Nunca se confirman más pasajeros que cupos.':'Comprueba la confirmación antes de salir. Solicitar no reserva el cupo.')+'</p></div><div class="section-title"><h2>'+state.requests.length+' solicitudes</h2><button class="btn secondary" data-action="refresh">↻ Actualizar</button></div><div class="request-list">'+(state.requests.length?state.requests.map(r=>{let active=r.trip_status==='open'&&new Date(r.departure)>new Date();let buttons='';if(driver&&r.status==='pending'&&active)buttons='<button class="btn" data-action="accept" data-id="'+esc(r.id)+'">Aceptar</button><button class="btn danger" data-action="reject" data-id="'+esc(r.id)+'">Rechazar</button>';if(!driver&&['accepted','pending'].includes(r.status)&&active)buttons='<button class="btn danger" data-action="withdraw" data-id="'+esc(r.id)+'">Cancelar solicitud</button>';return '<article class="panel request"><div><div class="tag muted">'+esc(driver?r.passenger_name:r.driver_name)+'</div><h3 style="margin-top:7px">'+esc(r.origin)+' → '+esc(r.destination)+'</h3><small>'+esc(fmt(r.departure))+' · S/ '+money(r.cost)+' · '+esc(r.meeting)+'</small>'+badge(r.status)+' <span class="muted" style="font-size:11px">Viaje: '+esc(labels[r.trip_status])+'</span></div><div class="actions">'+buttons+'</div></article>'}).join(''):'<div class="empty"><h3>Aún no hay solicitudes</h3><p>'+(driver?'Cuando alguien solicite un cupo en tus viajes, aparecerá aquí.':'Explora los viajes disponibles y solicita un cupo.')+'</p></div>')+'</div>'}
async function load(){if(!state.user)return;let u=new URLSearchParams({origin:state.origin,date:state.date});let response=state.view==='requests'?await api('requests'):state.view==='mine'?await api('mine'):state.view==='publish'?{}:await api('trips?'+u);if(response.trips)state.trips=response.trips;if(response.requests)state.requests=response.requests;render()}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.account){document.querySelector('#email').value=b.dataset.account+'@ecoruta.test';document.querySelector('#password').value='EcoRuta2026!';return}if(state.busy)return;try{state.busy=true;b.disabled=true;if(b.dataset.nav){state.view=b.dataset.nav;await load()}let id=b.dataset.id;switch(b.dataset.action){case 'logout':await api('logout','POST');state.user=null;state.view='explore';state.origin='';state.date='';render();break;case 'refresh':await load();notify('Datos actualizados.');break;case 'ask':await api('trips/'+id+'/request','POST');state.view='requests';await load();notify('Solicitud enviada. Espera la confirmación del conductor.');break;case 'accept':case 'reject':await api('requests/'+id+'/decision','POST',{status:b.dataset.action==='accept'?'accepted':'rejected'});await load();notify('Solicitud actualizada.');break;case 'withdraw':await api('requests/'+id+'/withdraw','POST');await load();notify('Solicitud cancelada.');break;case 'cancel-trip':await api('trips/'+id+'/cancel','POST');await load();notify('Viaje cancelado. Sus solicitudes ya no son válidas.');break;case 'complete':await api('trips/'+id+'/complete','POST');await load();notify('Viaje finalizado.');break}}catch(error){notify(error.message,true)}finally{state.busy=false;b.disabled=false}});
document.addEventListener('submit',async e=>{e.preventDefault();if(state.busy)return;let f=e.target,b=f.querySelector('button[type="submit"],button:not([type])'),data=Object.fromEntries(new FormData(f));state.busy=true;if(b)b.disabled=true;try{if(f.id==='login'){state.user=(await api('login','POST',data)).user;state.view='explore';await load()}else if(f.id==='search'){state.origin=data.origin;state.date=data.date;await load()}else if(f.id==='publish'){await api('trips','POST',{...data,departure:new Date(data.departure).toISOString(),capacity:Number(data.capacity),cost:Number(data.cost)});state.view='mine';await load();notify('Tu viaje ya está publicado.')}}catch(error){let el=f.querySelector('[role="alert"]');if(el)el.textContent=error.message;else notify(error.message,true)}finally{state.busy=false;if(b)b.disabled=false}});
(async()=>{try{state.user=(await api('session')).user;if(state.user)await load();else render()}catch(e){render();notify('No se pudo conectar. Vuelve a intentar en unos momentos.',true)}})();
</script></body></html>
